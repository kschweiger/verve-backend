name: Run Pytest Suite

on:
  push:
    branches:
      - "main"
      - "ci/**"
  pull_request:
    branches:
      - "main"
      - "ci/**"
    types:
      - opened
      - synchronize

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.4@sha256:d0b5a6ecab18997637f55a83cb4a9467391de5645916cfa1b6f2a8d19eee7be5
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8.10.1-alpine@sha256:bd999b5cfee25fb24b8320a31fddbd69f462df44c8138c66e369582937beebc0
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install and Configure Service Clients
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create PostgreSQL Schema
        env:
          PGPASSWORD: testpassword
        run: |
          psql -h localhost -U testuser -d testdb -c "CREATE SCHEMA api;"

      - name: Enable PostGIS Extension
        env:
          PGPASSWORD: testpassword
        run: |
          psql -h localhost -U testuser -d testdb -c "CREATE EXTENSION IF NOT EXISTS postgis;"

      - name: Enable pg_trgm Extension
        env:
          PGPASSWORD: testpassword
        run: |
          psql -h localhost -U testuser -d testdb -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"
      - name: Enable fuzzystrmatch Extension
        env:
          PGPASSWORD: testpassword
        run: |
          psql -h localhost -U testuser -d testdb -c "CREATE EXTENSION IF NOT EXISTS fuzzystrmatch;"
      - name: Configure RLS User and Permissions
        env:
          PGPASSWORD: testpassword
        run: |
          psql -h localhost -U testuser -d testdb -c "
            CREATE ROLE verve_user LOGIN PASSWORD 'rlstestpassword' NOINHERIT;
            GRANT USAGE ON SCHEMA api TO verve_user;
            ALTER DEFAULT PRIVILEGES IN SCHEMA api GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO verve_user;
            ALTER DEFAULT PRIVILEGES IN SCHEMA api GRANT USAGE ON SEQUENCES TO verve_user;
          "
      - name: Start RustFS service
        run: |
          docker run -d --name rustfs-container \
            -p 9000:9000 \
            -p 9001:9001 \
            -e "RUSTFS_ACCESS_KEY=minioadmin" \
            -e "RUSTFS_SECRET_KEY=minioadmin" \
            rustfs/rustfs:1.0.0-alpha.82@sha256:eadee1b524ec05cbc1fe08426a95e589bc70e70cd15a4591edf176cabde238a6

      - name: Configure RustFS (Create Bucket)
        run: |
          until curl --fail --silent http://localhost:9000/health; do sleep 1; done
          docker run --rm --network=host --entrypoint /bin/sh rustfs/rc:latest \
            -c 'rc alias set rustfs http://localhost:9000 minioadmin minioadmin && rc mb rustfs/verve-testing'

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: "pyproject.toml"

      - name: Install uv and enable caching
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Install main and test dependencies from lock file
        run: uv sync --locked --group test --no-dev

      - name: Run pytest
        run: uv run pytest
        env:
          # Application Settings
          FRONTEND_HOST: "http://localhost:3000"
          SECRET_KEY: "djgaherluhglaeiruhgluie"
          # Service Connection Settings
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB_TESTING: testdb
          POSTGRES_SCHEMA_NAME: "verve"
          POSTGRES_RLS_USER: "verve_user"
          POSTGRES_RLS_PASSWORD: "rlstestpassword"
          BOTO3_ENDPOINT: "http://localhost:9000"
          BOTO3_ACCESS: minioadmin
          BOTO3_SECRET: minioadmin

      - name: Run RLS guard
        run: uv run python -m verve_backend.cli.ensure_rls
        env:
          # Application Settings
          FRONTEND_HOST: "http://localhost:3000"
          SECRET_KEY: "djgaherluhglaeiruhgluie"
          ENVIRONMENT: testing
          # Service Connection Settings
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB_TESTING: testdb
          POSTGRES_SCHEMA: "api"
          POSTGRES_RLS_USER: "verve_user"
          POSTGRES_RLS_PASSWORD: "rlstestpassword"
          BOTO3_ENDPOINT: "http://localhost:9000"
          BOTO3_ACCESS: minioadmin
          BOTO3_SECRET: minioadmin
